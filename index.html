    .search-wrap {
      margin-top: 3rem;
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      font-family: var(--font);
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 0.35rem 0;
      outline: none;
      letter-spacing: 0.01em;
      transition: border-color 0.2s ease;
    }

    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-bottom-color: var(--ink); }

    .search-results {
      margin-top: 1.5rem;
      width: 100%;
      text-align: left;
      display: none;
    }

    .search-results.visible { display: block; }

    .search-result-item {

      display: grid;
      grid-template-columns: 3.5rem 1fr;
      gap: 0 1.25rem;
      align-items: baseline;
    }

    .search-result-item:last-child { border-bottom: 1px solid #e4e3dc; }

    .search-result-year {
      font-size: 0.82rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .search-result-body {
      display: flex;
      flex-direction: column;
      gap: 0.08rem;
    }

    .search-result-title { font-size: 0.95rem; line-height: 1.4; }
    .search-result-title a { text-decoration: none; color: var(--ink); }
    .search-result-title a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }

    .search-result-meta {
      font-size: 0.78rem;

      margin-bottom: 0.15rem;

    .search-result-desc { font-size: 0.82rem; color: #7a7a74; line-height: 1.45; }
    .search-empty { font-size: 0.88rem; color: var(--muted); padding: 0.5rem 0; }

    body.dark .search-result-item { border-top-color: #2a2926; }
    body.dark .search-result-item:last-child { border-bottom-color: #2a2926; }

    function search(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return INDEX.filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.desc.toLowerCase().includes(q) ||
        item.track.toLowerCase().replace('+', 'and').includes(q) ||
        item.track.toLowerCase().includes(q) ||
        item.year.toLowerCase().includes(q)
      );
    }

    function renderResults(results, query) {
      const container = document.getElementById('search-results');
      if (!query.trim()) {
        container.classList.remove('visible');
        container.innerHTML = '';
        return;
      }
      container.classList.add('visible');
      if (results.length === 0) {
        container.innerHTML = '<p class="search-empty">No results.</p>';
        return;
      }
      container.innerHTML = results.map(item => {
        const target = item.external ? ' target="_blank" rel="noopener noreferrer"' : '';
        const titleHtml = item.italic ? `<em>${item.title}</em>` : item.title;
        return `
        <div class="search-result-item">
          <span class="search-result-year">${item.year}</span>
          <div class="search-result-body">
            <span class="search-result-title">
              <a href="${item.href}"${target}>${titleHtml}</a>
            </span>
            <div class="search-result-meta">
              <span class="search-result-track">${item.track}</span>
            </div>
            <span class="search-result-desc">${item.desc}</span>
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('search-input').addEventListener('input', function () {
      renderResults(search(this.value), this.value);
    });

    /* ─── THEME ─── */
    (function () {
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.querySelector('.landing-toggle').textContent = 'light';
      }
    })();

    function toggleTheme() {
      const btn = document.querySelector('.landing-toggle');
      if (document.body.classList.toggle('dark')) {
        localStorage.setItem('theme', 'dark');
        btn.textContent = 'light';
      } else {
        localStorage.setItem('theme', 'light');
        btn.textContent = 'dark';
      }
    }
  </script>
