  <div class="container">
    <nav class="site-nav">
      <a class="bare back" href="../index.html">Ayoola Olaoye</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">dark</button>
    </nav>
  </div>

  <div class="container">
    <article class="article">
      <header class="article-header">
        <span class="article-meta">Mar 2025 · Law + Engineering</span>
        <h1 class="article-title"><em>The Dual Practitioner Problem</em></h1>

      <a href="../engineering.html">Engineering →</a>
    </div>
  </div>

  <script>
    (function () {
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.querySelector('.theme-toggle').textContent = 'light';
      }
    })();

    function toggleTheme() {
      const btn = document.querySelector('.theme-toggle');
      if (document.body.classList.toggle('dark')) {
        localStorage.setItem('theme', 'dark');
        btn.textContent = 'light';
      } else {
        localStorage.setItem('theme', 'light');
        btn.textContent = 'dark';
      }
    }
  </script>

</body>
